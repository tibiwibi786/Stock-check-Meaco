def fetch_page(url: str) -> str:
    try:
        resp = requests.get(url, headers=HEADERS, timeout=15)
        if resp.status_code == 200:
            return resp.text
        print(f"  Plain request got status {resp.status_code}, trying fallback...")
    except requests.RequestException as e:
        print(f"  Plain request failed ({e}), trying fallback...")

    if not HAS_CLOUDSCRAPER:
        raise RuntimeError(
            "Blocked, and cloudscraper isn't installed. "
            "Add 'cloudscraper' to the pip install step."
        )

    scraper = cloudscraper.create_scraper(browser={"custom": HEADERS["User-Agent"]})
    resp = scraper.get(url, timeout=20)
    resp.raise_for_status()
    return resp.text


def check_retailer(retailer: dict) -> bool:
    html = fetch_page(retailer["url"])
    return retailer["out_of_stock_text"] not in html


def notify_discord(message: str):
    if not DISCORD_WEBHOOK_URL:
        print("No DISCORD_WEBHOOK_URL set - skipping notification.")
        return
    try:
        requests.post(DISCORD_WEBHOOK_URL, json={"content": message}, timeout=10)
    except requests.RequestException as e:
        print(f"Failed to send Discord notification: {e}")


if __name__ == "__main__":
    in_stock_alerts = []

    for retailer in RETAILERS:
        print(f"Checking {retailer['name']}...")
        try:
            in_stock = check_retailer(retailer)
        except Exception as e:
            print(f"  Error checking {retailer['name']}: {e}")
            continue

        if in_stock:
            print(f"  IN STOCK at {retailer['name']}!")
            in_stock_alerts.append(retailer)
        else:
            print(f"  Still out of stock at {retailer['name']}.")

    if in_stock_alerts:
        lines = ["🚨 Meaco Cirro air conditioner IN STOCK at:"]
        for r in in_stock_alerts:
            lines.append(f"- {r['name']}: {r['url']}")
        notify_discord("\n".join(lines))
    else:
        print("No retailers in stock this check.")
        now = datetime.now(timezone.utc)
        if now.minute == 0:
            notify_discord(
                f"✅ Heartbeat: checked all {len(RETAILERS)} listings at "
                f"{now.strftime('%Y-%m-%d %H:%M UTC')} - still all out of stock."
            )
